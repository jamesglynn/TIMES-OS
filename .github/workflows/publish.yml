name: publish to PyPI

# A release tag (v<x.y.z>) on a commit of main uploads the package times-os to PyPI, once it has passed the same test
# as the CI's package job on Windows, Linux and macOS. A tag on a commit that is not on main uploads nothing. The upload is by PyPI's trusted publishing: PyPI trusts this workflow of this
# repository in the environment "pypi"; no password or token is stored anywhere. A version on PyPI can never be
# replaced: a failed or wrong upload is followed by a new version number, never by the same one again.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the whole history: the next step asks whether the tagged commit is on main
      - name: the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          if git merge-base --is-ancestor "$commit" origin/main; then
            echo "$GITHUB_REF_NAME is $commit, a commit of main"
          else
            echo "$GITHUB_REF_NAME is $commit, which is not on main: only a release of main is uploaded; nothing is uploaded"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build the wheel and the source archive
        run: |
          python -m pip install build
          python -m build --outdir dist
      - name: the tag and the package give the same version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          launcher=$(python -c "import re; print(re.search(r'(?m)^__version__ = \"([^\"]*)\"', open('times_os/__init__.py').read()).group(1))")
          echo "tag $tag, pyproject.toml $pkg, times_os/__init__.py $launcher"
          ls dist/times_os-"$tag"-py3-none-any.whl
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$launcher" ]; then echo "the tag and the package's version differ: nothing is uploaded"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: install the wheel into a fresh environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/user"
          PY="$RUNNER_TEMP/user/bin/python"; [ -x "$PY" ] || PY="$RUNNER_TEMP/user/Scripts/python.exe"
          "$PY" -m pip install dist/*.whl
          echo "USER_PY=$PY" >> "$GITHUB_ENV"
      - name: example, first run (sets itself up), check, second run
        shell: bash
        run: python .github/scripts/check_package.py "$RUNNER_TEMP/work" --python "$USER_PY" --clean

  upload:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true   # a rerun of this job after a half-made upload: the same files of this run
